# Spark defaults for the ARAMCO PySpark ETL framework.
# Applied via --properties-file in spark-submit / SparkSubmitOperator.

spark.sql.extensions                                io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                     org.apache.spark.sql.delta.catalog.DeltaCatalog

# Adaptive query execution
spark.sql.adaptive.enabled                          true
spark.sql.adaptive.coalescePartitions.enabled        true
spark.sql.adaptive.skewJoin.enabled                  true

# Shuffle / partitioning defaults (tune per environment size)
spark.sql.shuffle.partitions                         200
spark.sql.files.maxPartitionBytes                    134217728

# Delta Lake behaviour
spark.databricks.delta.retentionDurationCheck.enabled true
spark.databricks.delta.schema.autoMerge.enabled       false
spark.databricks.delta.optimizeWrite.enabled          true
spark.databricks.delta.autoCompact.enabled            true

# Warehouse root (overridden per environment: DEV / UAT / PROD)
spark.sql.warehouse.dir                               ${DATALAKE_ROOT}/warehouse

# Serialization
spark.serializer                                      org.apache.spark.serializer.KryoSerializer
